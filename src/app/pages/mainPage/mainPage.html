<app-navbar-component class="desktop-nav"></app-navbar-component>

<main
  class="relative isolate min-h-screen w-full overflow-hidden
         bg-[#0A0E14] font-sans text-[#E7EDF5]
         transition-all duration-300
         pl-0 lg:pl-24 xl:pl-0"
>
  <app-hero></app-hero>

  <app-about-me></app-about-me>

  <app-skills></app-skills>

  <app-timeline-component></app-timeline-component>

  <app-footer></app-footer>

  @if (notFoundMessage()) {
    <div
      role="alert"
      class="fixed left-4 right-4 top-6 z-[70] rounded-xl
             border border-red-300 bg-rose-800 p-4 text-white
             shadow-lg shadow-red-500/20
             sm:left-auto sm:right-8 sm:w-full sm:max-w-sm"
    >
      {{ notFoundMessage() }}
    </div>
  }
</main>
