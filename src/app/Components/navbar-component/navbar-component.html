<!-- Desktop vertical nav (lg and up) -->
<nav
  #desktopNav
  (pointerdown)="startDrag($event)"
  [class.at-projects]="activeId() === 'projects'"
  [class.nav-comet]="navJustMoved()"
  [class]="navPositionClass()"
  class="z-50 hidden rounded-full border border-[var(--border-soft)] bg-[var(--bg-elevated)]/80 px-2 py-4 font-mono text-xs text-[var(--muted)] shadow-xl backdrop-blur transition-all duration-500 ease-in-out fixed lg:block"
  aria-label="{{ 'navbar.ariaLabel' | translate }}"
>
  <div
    [ngClass]="atTop() || atBottom() ? 'flex-row' : 'flex-col'"
    class="relative flex items-center gap-2 md:gap-8"
  >
    <div
      [ngClass]="
        atTop() || atBottom()
          ? 'top-1/2 left-3 right-3 h-px -translate-y-1/2'
          : 'left-1/2 top-4 bottom-4 w-px -translate-x-1/2'
      "
      class="pointer-events-none absolute bg-[var(--border-soft)]"
    ></div>

    @for (section of sections; track section) {
      <a
        [attr.href]="'/#' + section.id"
        (click)="onLinkClick($event, section.id)"
        class="group relative z-10 flex h-9 w-9 items-center border-0 justify-center rounded-full bg-[var(--bg-elevated)]"
        [attr.aria-current]="activeId() === section.id ? 'location' : null"
        [attr.aria-label]="section.label | translate"
      >
        <span
          class="material-symbols-outlined transition-all duration-300 group-hover:scale-110 group-hover:text-[var(--accent)]"
          [class.text-[var(--accent)]]="activeId() === section.id"
          [class.text-[var(--muted)]]="activeId() !== section.id"
          [class.drop-shadow-[0_0_5px_var(--accent)]]="activeId() === section.id"
          [style.font-variation-settings]="
            activeId() === section.id
              ? '\'FILL\' 1, \'wght\' 600, \'GRAD\' 0, \'opsz\' 24'
              : '\'FILL\' 0, \'wght\' 400, \'GRAD\' 0, \'opsz\' 24'
          "
        >
          {{ section.icon }}
        </span>

        <span
          class="pointer-events-none absolute left-full ml-3 -translate-x-1 whitespace-nowrap rounded-md border border-[var(--border-soft)] bg-[var(--bg-elevated)] px-2.5 py-1 text-[11px] text-[var(--fg)] opacity-0 shadow-lg transition-all duration-200 ease-out group-hover:translate-x-0 group-hover:opacity-100"
        >
          {{ section.label | translate }}
        </span>
      </a>
    }

    <div
      class="lg:hidden mt-4 flex flex-col items-center gap-2 rounded-3xl border border-[var(--border)] bg-[var(--bg)]/80 px-3 py-3 text-xs text-[var(--fg)]"
    >
      <button
        type="button"
        (click)="setLanguage('en')"
        [class.bg-[var(--accent)]]="language() === 'en'"
        [class.text-[var(--accent-contrast)]]="language() === 'en'"
        [class.text-[var(--fg)]]="language() !== 'en'"
        class="rounded-full px-3 py-1 transition duration-200"
      >
        EN
      </button>
      <button
        type="button"
        (click)="setLanguage('el')"
        [class.bg-[var(--accent)]]="language() === 'el'"
        [class.text-[var(--accent-contrast)]]="language() === 'el'"
        [class.text-[var(--fg)]]="language() !== 'el'"
        class="rounded-full px-3 py-1 transition duration-200"
      >
        EL
      </button>
    </div>
  </div>
</nav>

<!-- Mobile: hamburger in top-right that opens a compact nav -->
<div class="fixed right-4 top-4 z-60 lg:hidden">
  <button
    *ngIf="mobileBurgerVisible || mobileOpen"
    (click)="toggleMobileMenu()"
    aria-controls="mobile-nav"
    [attr.aria-expanded]="mobileOpen"
    aria-label="Άνοιγμα πλοήγησης"
    class="inline-flex items-center justify-center h-12 w-12 rounded-full border border-[var(--border-soft)] bg-[var(--bg-elevated)]/80 text-[var(--fg)] focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-[var(--accent)]"
  >
    <span *ngIf="!mobileOpen">
      <span class="material-symbols-outlined inline-flex pt-1 items-center justify-center">
        menu
      </span>
    </span>
    <span *ngIf="mobileOpen">✕</span>
  </button>

  <div
    *ngIf="mobileOpen"
    id="mobile-nav"
    class="mt-2 w-fit rounded-lg border border-[var(--border-soft)] bg-[var(--bg)] p-3 shadow-lg"
  >
    <div
      class="mb-3 flex items-center justify-center gap-2 rounded-2xl border border-[var(--border)] bg-[var(--bg)]/80 p-2 text-sm text-[var(--fg)]"
    >
      <button
        type="button"
        (click)="setLanguage('en')"
        [class.bg-[var(--accent)]]="language() === 'en'"
        [class.text-[var(--accent-contrast)]]="language() === 'en'"
        [class.text-[var(--fg)]]="language() !== 'en'"
        class="rounded-full px-3 py-1 transition duration-200"
      >
        EN
      </button>
      <button
        type="button"
        (click)="setLanguage('el')"
        [class.bg-[var(--accent)]]="language() === 'el'"
        [class.text-[var(--accent-contrast)]]="language() === 'el'"
        [class.text-[var(--fg)]]="language() !== 'el'"
        class="rounded-full px-3 py-1 transition duration-200"
      >
        EL
      </button>
    </div>

    <nav class="flex flex-col gap-1 h-fit py-2 w-56">
      @for (section of sections; track section) {
        <a
          [attr.href]="'/#' + section.id"
          (click)="onLinkClick($event, section.id)"
          class="flex items-center gap-3 rounded-lg border-2 border-[var(--border)]/40 px-3 py-4 text-sm text-[var(--fg)] transition hover:bg-[var(--bg-elevated)]/60"
        >
          <span class="material-symbols-outlined text-lg">
            {{ section.icon }}
          </span>

          {{ section.label | translate }}
        </a>
      }
    </nav>
  </div>
</div>
