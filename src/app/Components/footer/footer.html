<footer
  id="contact"
  class="relative overflow-hidden border-t border-[#1E293B] bg-[#020617]"
>
  <!-- Διακριτικό background glow -->
  <div
    aria-hidden="true"
    class="pointer-events-none absolute left-1/2 top-0 h-64 w-64
           -translate-x-1/2 -translate-y-1/2 rounded-full
           bg-[#5FD4F0]/10 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-7xl px-12 py-16 lg:px-8">
    <div class="grid gap-12 lg:grid-cols-[1.3fr_1fr] lg:items-center">

      <!-- Κείμενο και CTA -->
      <div class="max-w-2xl">
        <p
          class="text-sm font-medium uppercase tracking-[0.3em] text-[#5FD4F0]"
        >
          {{ 'footer.contactLabel' | translate }}
        </p>

        <h2
          class="mt-4 text-3xl font-semibold tracking-tight text-[white] sm:text-4xl md:mt-6 md:text-5xl lg:mt-8 lg:text-6xl"
        >
          {{ 'footer.title' | translate }}
        </h2>

        <p class="mt-5 max-w-xl text-base leading-7 text-[#94A3B8]">
          {{ 'footer.description' | translate }}
        </p>

        <a
          href="mailto:panagiotis.zois@outlook.com"
          class="mt-8 inline-flex items-center gap-2 rounded-full
                 bg-[#5FD4F0] px-6 py-3 text-sm font-semibold text-[#071118]
                 transition duration-300
                 hover:-translate-y-0.5 hover:bg-[#7DDEF4]
                 focus:outline-none focus:ring-2 focus:ring-[#5FD4F0]
                 focus:ring-offset-2 focus:ring-offset-[#020617]"
        >
          <span class="material-symbols-outlined text-xl">mail</span>
          {{ 'footer.emailButton' | translate }}
        </a>
      </div>

      <!-- Social links -->
      <div class="lg:justify-self-end">
        <p class="mb-4 text-sm text-[#64748B]">
          {{ 'footer.socialPrompt' | translate }}
        </p>

        <nav aria-label="Social media">
          <ul class="flex flex-wrap gap-3">

            <li>
              <a
                href="https://www.linkedin.com/in/panagiotis-zois-550a84240/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
                class="group inline-flex h-12 w-12 items-center justify-center
                       rounded-full border border-[#334155] bg-[#0F172A]
                       text-[#CBD5E1] transition duration-300
                       hover:-translate-y-1 hover:border-[#5FD4F0]
                       hover:text-[#5FD4F0]"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.026-3.038-1.852-3.038-1.853 0-2.136 1.445-2.136 2.939v5.668H9.353V9h3.414v1.561h.049c.476-.9 1.637-1.852 3.369-1.852 3.604 0 4.271 2.371 4.271 5.456v6.287zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zm1.777 13.019H3.56V9h3.554v11.452zM22.225 0H1.771C.792 0 0 .775 0 1.732v20.535C0 23.225.792 24 1.771 24h20.451C23.2 24 24 23.225 24 22.267V1.732C24 .775 23.2 0 22.225 0z"/>
                </svg>
              </a>
            </li>

            <li>
              <a
                href="https://github.com/zoespanagiotes-hash"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
                class="group inline-flex h-12 w-12 items-center justify-center
                       rounded-full border border-[#334155] bg-[#0F172A]
                       text-[#CBD5E1] transition duration-300
                       hover:-translate-y-1 hover:border-[#5FD4F0]
                       hover:text-[#5FD4F0]"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path d="M12 0.297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.612-4.042-1.612-.546-1.387-1.333-1.757-1.333-1.757-1.089-.744.084-.729.084-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305 3.495 .998.108-.776.418-1.305.762-1.605-2.665-.305-5.467-1.332-5.467-5.93 0-1.31.468-2.381 1.235-3.221-.123-.303-.535-1.527.117-3.176 0 0 1.008-.322 3.301 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.291-1.552 3.297-1.23 3.297-1.23 .653 1.649 .241 2.873 .118 3.176 .77 .84 1.233 1.911 1.233 3.221 0 4.61-2.807 5.623-5.48 5.922 .43 .37 .823 1.102 .823 2.222 0 1.606-.015 2.896-.015 3.286 0 .319 .218 .694 .825 .576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
              </a>
            </li>

            <li>
              <a
                href="https://www.instagram.com/panagiotis_zois_/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
                class="group inline-flex h-12 w-12 items-center justify-center
                       rounded-full border border-[#334155] bg-[#0F172A]
                       text-[#CBD5E1] transition duration-300
                       hover:-translate-y-1 hover:border-[#5FD4F0]
                       hover:text-[#5FD4F0]"
              >
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.34 3.608 1.314.975.976 1.252 2.243 1.314 3.608.058 1.266.069 1.646.069 4.85s-.012 3.584-.07 4.85c-.062 1.366-.34 2.633-1.314 3.608-.976.975-2.243 1.252-3.608 1.314-1.266.058-1.646.069-4.85.069s-3.584-.012-4.85-.07c-1.366-.062-2.633-.34-3.608-1.314-.975-.976-1.252-2.243-1.314-3.608C2.175 15.584 2.163 15.204 2.163 12s.012-3.584.07-4.85c.062-1.366.34-2.633 1.314-3.608C4.522 2.503 5.789 2.226 7.155 2.163 8.421 2.105 8.801 2.094 12 2.094zm0-2.163C8.756 0 8.332.013 7.052.072 5.776.131 4.548.42 3.515 1.453 2.482 2.486 2.193 3.714 2.134 4.99.075 6.27.062 6.694.062 12s.013 5.73.072 7.01c.059 1.276.348 2.504 1.381 3.537 1.033 1.033 2.261 1.322 3.537 1.381 1.28.059 1.704.072 7.01.072s5.73-.013 7.01-.072c1.276-.059 2.504-.348 3.537-1.381 1.033-1.033 1.322-2.261 1.381-3.537.059-1.28.072-1.704.072-7.01s-.013-5.73-.072-7.01c-.059-1.276-.348-2.504-1.381-3.537C19.514.42 18.286.131 17.01.072 15.73.013 15.304 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zm0 10.162a3.999 3.999 0 1 1 0-7.998 3.999 3.999 0 0 1 0 7.998zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
                </svg>
              </a>
            </li>

          </ul>
        </nav>
      </div>
    </div>

    <!-- Bottom bar -->
    <div
      class="mt-14 flex flex-col gap-3 border-t border-[#1E293B] pt-6
             text-sm text-[#64748B]
             sm:flex-row sm:items-center sm:justify-between"
    >
      <p>
        {{ 'footer.copyright' | translate }} {{ currentYear }} {{ 'footer.copyrightText' | translate }}
      </p>

    <button
      type="button"
      (click)="scrollToTop()"
      class="inline-flex items-center gap-1 transition hover:text-[#5FD4F0]"
      aria-label="{{ 'footer.aria.backToTop' | translate }}"
    >
      {{ 'footer.backToTop' | translate }}
      <span class="material-symbols-outlined">
        arrow_upward
      </span>
    </button>
    </div>
  </div>
</footer>
